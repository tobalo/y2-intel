name: Dev Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build dev binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dupdate-channel=dev

      - name: Package
        run: |
          package_dir="$RUNNER_TEMP/fx-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/fx LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf fx-${{ matrix.name }}.tar.gz -C "$package_dir" fx LICENSE THIRD_PARTY_NOTICES.md
          sha256sum fx-${{ matrix.name }}.tar.gz > fx-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx-${{ matrix.name }}
          path: |
            fx-${{ matrix.name }}.tar.gz
            fx-${{ matrix.name }}.tar.gz.sha256

  web:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Build web artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build terminal WASM
        run: zig build -Doptimize=ReleaseSafe -Dwasm-surface=term

      - name: Package web artifacts
        run: |
          cp sdk/fx-sdk.js fx-sdk.js
          cp zig-out/bin/fx-term.wasm fx-term.wasm
          sha256sum fx-sdk.js > fx-sdk.js.sha256
          sha256sum fx-term.wasm > fx-term.wasm.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx-web
          path: |
            fx-sdk.js
            fx-sdk.js.sha256
            fx-term.wasm
            fx-term.wasm.sha256
