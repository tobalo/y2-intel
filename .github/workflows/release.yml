name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/main.zig"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check if release needed
        id: check
        run: |
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version is not strict SemVer"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            PREVIOUS_VERSION=$(git show "${GITHUB_SHA}^:src/main.zig" 2>/dev/null \
              | grep 'pub const version' \
              | head -1 \
              | sed 's/.*"\(.*\)".*/\1/' || true)
            if [ "$VERSION" = "$PREVIOUS_VERSION" ]; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "Version unchanged at ${VERSION}; no release needed"
              exit 0
            fi
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} exists, no release needed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} missing, release needed"
          fi

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          package_dir="$RUNNER_TEMP/y2-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/y2 LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf y2-${{ matrix.name }}.tar.gz -C "$package_dir" y2 LICENSE THIRD_PARTY_NOTICES.md
          sha256sum y2-${{ matrix.name }}.tar.gz > y2-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: y2-${{ matrix.name }}
          path: |
            y2-${{ matrix.name }}.tar.gz
            y2-${{ matrix.name }}.tar.gz.sha256

  build-macos-x86_64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build macos-x86_64
    runs-on: macos-15-intel
    environment: apple-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos

      - name: Sign and notarize
        env:
          Y2_SIGNING_IDENTITY: ${{ vars.Y2_SIGNING_IDENTITY }}
          Y2_SIGNING_IDENTIFIER: ${{ vars.Y2_SIGNING_IDENTIFIER }}
          Y2_SIGNING_TEAM_ID: ${{ vars.Y2_SIGNING_TEAM_ID }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/sign-and-notarize-macos.sh zig-out/bin/y2

      - name: Package
        run: |
          package_dir="$RUNNER_TEMP/y2-package-macos-x86_64"
          mkdir -p "$package_dir"
          cp zig-out/bin/y2 LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf y2-macos-x86_64.tar.gz -C "$package_dir" y2 LICENSE THIRD_PARTY_NOTICES.md
          shasum -a 256 y2-macos-x86_64.tar.gz > y2-macos-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: y2-macos-x86_64
          path: |
            y2-macos-x86_64.tar.gz
            y2-macos-x86_64.tar.gz.sha256

  build-macos-arm64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pgso-macos-arm64.yml
    with:
      package_release: true

  release:
    needs: [check-version, build-linux, build-macos-x86_64, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: y2-*
          merge-multiple: true

      - name: Create git tag
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git tag -- "$RELEASE_TAG"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Extract changelog entry
        run: |
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > /tmp/release-notes.md
          LINES=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$LINES" -lt 2 ]; then
            echo "Error: No release notes found between <!-- release:start --> and <!-- release:end --> markers in CHANGELOG.md"
            exit 1
          fi
          echo "Extracted release notes ($LINES lines)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          body_path: /tmp/release-notes.md
          files: |
            y2-*.tar.gz
            y2-*.tar.gz.sha256
